name: momen_pair_client
description: Cross-platform client for the MomenPair family space.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_image_compress: ^2.5.1
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: any

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
